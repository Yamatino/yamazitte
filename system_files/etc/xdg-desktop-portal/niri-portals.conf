# Which backend implements each xdg-desktop-portal interface under niri.
#
# xdg-desktop-portal reads {XDG_CURRENT_DESKTOP}-portals.conf, and /etc wins
# over the copy niri ships in /usr/share/xdg-desktop-portal/. This is that
# file with one line added: FileChooser=gtk.
#
# Why: upstream's `default=gnome;gtk;` lets the GNOME backend take every
# interface it advertises, FileChooser included. Since GNOME 48 that backend
# does not draw the file dialog itself but delegates it to Nautilus over
# D-Bus, and Nautilus is not on this image (KDE base, Dolphin as file
# manager). The call fails with "The name is not activatable" and sandboxed
# apps (Flatpak Chrome's "Save image as...", every Flatpak open/save dialog)
# silently get no dialog. The gtk backend draws the classic GTK dialog itself.
#
# The gnome backend is still wanted for what only it does under niri:
# ScreenCast/Screenshot (screen sharing, via niri's wlr-screencopy bridge).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
