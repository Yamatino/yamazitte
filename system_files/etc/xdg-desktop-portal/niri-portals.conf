# Which backend implements each xdg-desktop-portal interface under niri.
#
# xdg-desktop-portal reads {XDG_CURRENT_DESKTOP}-portals.conf, and /etc wins
# over the copy niri ships in /usr/share/xdg-desktop-portal/. This is that
# file with one line added: FileChooser=kde.
#
# Why not leave it to `default=gnome;gtk;`: that lets the GNOME backend take
# every interface it advertises, FileChooser included. Since GNOME 48 that
# backend does not draw the file dialog itself but delegates it to Nautilus
# over D-Bus, and Nautilus is not on this image (KDE base, Dolphin as file
# manager). The call fails with "The name is not activatable" and sandboxed
# apps (Flatpak Chrome's "Save image as...", every Flatpak open/save dialog)
# silently get no dialog.
#
# Why kde rather than gtk: both draw a dialog themselves, but the gtk one is
# the plain GTK chooser. xdg-desktop-portal-kde (already on the Bazzite base)
# draws KDE's KFileWidget, the same dialog Dolphin and every KDE app use, with
# your pinned Places from ~/.local/share/user-places.xbel. Its .portal file
# says UseIn=KDE, which only stops it being picked *automatically* outside
# Plasma; naming it here is enough. Nothing in its file dialog needs KWin. It
# is D-Bus-activated as a systemd user unit, so it inherits
# QT_QPA_PLATFORMTHEME=kde from /etc/environment.d/50-yamazitte-qt.conf and
# comes up in your KDE colours and icons.
#
# The gnome backend is still wanted for what only it does under niri:
# ScreenCast/Screenshot (screen sharing, via niri's wlr-screencopy bridge).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=kde;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
