# Make Qt/KDE apps (Dolphin, Kate, Okular...) use the KDE platform theme in
# every session, not just Plasma.
#
# Plasma exports QT_QPA_PLATFORMTHEME=kde for its session; that is what makes
# Qt apps load plasma-integration, which reads your colour scheme, widget
# style, fonts and icons from ~/.config/kdeglobals. Under niri nothing sets
# it, so Qt falls back to the built-in Fusion style with a light palette and
# KDE apps come up white regardless of your dark settings.
#
# /etc/environment.d is read by the systemd user manager. The niri package
# runs niri as a user unit (niri.service), so this reaches niri, everything it
# spawns (Noctalia and its launcher), and D-Bus-activated apps. niri's own
# `environment {}` config block would only cover the first two.
QT_QPA_PLATFORMTHEME=kde
