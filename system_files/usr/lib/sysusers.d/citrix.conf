# Citrix's post-install creates the "citrixlog" user with useradd, i.e. by
# editing /etc/passwd inside the image. That does not survive to a machine
# that already has its own /etc/passwd (yours: it has your account), because
# bootc keeps locally modified /etc files. Declaring the user here makes
# systemd-sysusers create it at boot on every machine, with a system UID.
# The ctxcwalogd.service (Citrix logging daemon) runs as this user.
#
# Type Name       ID  GECOS                        Home             Shell
u      citrixlog  -   "Citrix Workspace log daemon" /var/log/citrix  /usr/sbin/nologin
