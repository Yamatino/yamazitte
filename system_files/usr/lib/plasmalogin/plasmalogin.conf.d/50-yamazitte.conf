# Defaults for Plasma Login Manager (Bazzite's login screen; SDDM's successor).
#
# Config stack, lowest to highest priority:
#   /usr/lib/plasmalogin/plasmalogin.conf.d/*.conf   <- this file (image defaults)
#   /etc/plasmalogin.conf.d/*.conf
#   /etc/plasmalogin.conf                            <- per-machine, wins
#
# Preselect niri on the login screen. Without this the greeter shows the last
# session used, or Plasma on a fresh install (its session list sorts plasma*
# first). The value is the session file name in /usr/share/wayland-sessions.
#
# Autologin is deliberately NOT set here: it needs a username, so it is
# per-machine state. To boot straight into niri on a machine that uses
# autologin, set Session=niri in the [Autologin] group of /etc/plasmalogin.conf.
[Greeter]
PreselectedSession=niri.desktop
