# Citrix Workspace hardcodes /opt/Citrix/ICAClient. On a bootc system /opt is
# a symlink to /var/opt, and /var is machine-local state: files the image puts
# under /var are only copied on the very first install and are NOT updated on
# later `bootc upgrade`/`switch`. So the build moves the real files to
# /usr/lib/opt/Citrix (part of the immutable image) and this rule recreates
# the /var/opt/Citrix -> /usr/lib/opt/Citrix symlink on every boot.
#
# Type Path              Mode UID  GID  Age Argument
d      /var/opt          0755 root root -
L+     /var/opt/Citrix   -    -    -    -   /usr/lib/opt/Citrix
